name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancels the superseded run when a branch is pushed again while its checks are still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml
