name: CI
on:
  push:
    branches:
      - main
  pull_request: null
permissions:
  contents: read
concurrency:
  group: ${{ format('ci-{0}', github.ref) }}
  cancel-in-progress: true
jobs:
  test:
    uses: ./.github/workflows/test.yml
  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.2
          args: release --snapshot --clean
    name: release-snapshot
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs:
      - test
      - release-snapshot
    if: ${{ always() }}
    steps:
      - name: Require every CI job to succeed
        if: ${{ needs['test'].result != 'success' || needs['release-snapshot'].result != 'success' }}
        run: exit 1
