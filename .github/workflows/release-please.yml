name: Release Please
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_id:
        description: Existing release ID to verify and recover; leave empty for Release Please
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
  queue: max
jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.release_id == '') }}
    runs-on: ubuntu-latest
    environment: automation
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          skip-token-revoke: false
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071
        with:
          token: ${{ steps.token.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  resolve:
    needs: [release]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.release.result == 'success' || needs.release.result == 'skipped') && (needs.release.outputs.release_id != '' || (github.event_name == 'workflow_dispatch' && inputs.release_id != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: read
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ inputs.release_id || needs.release.outputs.release_id }}
      AUTOMATION_APP_BOT_ID: ${{ vars.AUTOMATION_APP_BOT_ID }}
      AUTOMATION_APP_BOT_LOGIN: ${{ vars.AUTOMATION_APP_BOT_LOGIN }}
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
      published: ${{ steps.resolve.outputs.published }}
      build: ${{ steps.resolve.outputs.build }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: resolve
        run: python3 .github/scripts/release.py resolve
      - id: upload
        if: ${{ steps.resolve.outputs.bundle == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-bundle-${{ github.run_attempt }}
          path: bundle/
          retention-days: 30
          if-no-files-found: error
  build:
    needs: [resolve]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      TARGET_SHA: ${{ needs.resolve.outputs.sha }}
      GORELEASER_CURRENT_TAG: ${{ needs.resolve.outputs.tag }}
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: source/go.mod
          cache: false
      - name: Test release sources
        working-directory: source
        run: go test ./...
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de
        with:
          version: v2.20.2
          workdir: source
          args: build --clean --parallelism 1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - name: Package release without publication credentials
        run: python3 automation/.github/scripts/build-release.py --source source --tag "$RELEASE_TAG" --output bundle
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-bundle-${{ github.run_attempt }}
          path: bundle/
          retention-days: 30
          if-no-files-found: error
  verify-artifact:
    needs: [resolve, build]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') && needs.resolve.outputs.published != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET: ${{ needs.resolve.outputs.target }}
      ARTIFACT_ID: ${{ needs.build.outputs.artifact_id || needs.resolve.outputs.artifact_id }}
      ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest || needs.resolve.outputs.artifact_digest }}
      AUTOMATION_APP_BOT_ID: ${{ vars.AUTOMATION_APP_BOT_ID }}
      AUTOMATION_APP_BOT_LOGIN: ${{ vars.AUTOMATION_APP_BOT_LOGIN }}
    outputs:
      hashes: ${{ steps.verify.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: verify
        run: python3 .github/scripts/release.py verify-artifact
  publish:
    needs: [resolve, build, verify-artifact]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') && (needs.verify-artifact.result == 'success' || needs.resolve.outputs.published == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET: ${{ needs.resolve.outputs.target }}
      AUTOMATION_APP_BOT_ID: ${{ vars.AUTOMATION_APP_BOT_ID }}
      AUTOMATION_APP_BOT_LOGIN: ${{ vars.AUTOMATION_APP_BOT_LOGIN }}
      ARTIFACT_ID: ${{ needs.build.outputs.artifact_id || needs.resolve.outputs.artifact_id }}
      ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest || needs.resolve.outputs.artifact_digest }}
      BUNDLE_HASHES: ${{ needs.verify-artifact.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: ${{ needs.resolve.outputs.published != 'true' }}
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id || needs.resolve.outputs.artifact_id }}
          path: bundle
          merge-multiple: true
      - name: Install image copy tool
        run: sudo apt-get update && sudo apt-get install --yes skopeo
      - name: Authenticate image publication
        run: |
          echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/registry-auth.json" >> "$GITHUB_ENV"
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$RUNNER_TEMP/registry-auth.json" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
      - name: Verify, publish, and advance Latest
        run: python3 .github/scripts/release.py publish
      - name: Remove registry credentials
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/registry-auth.json"
