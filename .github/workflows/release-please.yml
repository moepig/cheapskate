name: Release Please
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: false
        description: Existing draft release tag to retry; leave empty for normal Release Please operation
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' && !inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  distribute:
    needs: release
    if: ${{ always() && github.ref == 'refs/heads/main' && (needs.release.outputs.release_created == 'true' || inputs.tag != '') }}
    uses: ./.github/workflows/distribute.yml
    with:
      tag: ${{ inputs.tag || needs.release.outputs.tag }}
      sha: ${{ needs.release.outputs.sha || '' }}
    permissions:
      contents: write
      packages: write
