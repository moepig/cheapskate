name: Distribute release
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      sha:
        required: false
        type: string
        default: ""
permissions:
  contents: read
jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag and draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |-
          test "$(git rev-parse HEAD)" = "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          if [ -n "$EXPECTED_SHA" ]; then test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"; fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
      - name: Verify uploaded checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |-
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release-assets"
          cd "$RUNNER_TEMP/release-assets"
          sha256sum --check checksums.txt
      - name: Advance stable image tags
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |-
          if [[ "$RELEASE_TAG" != *-* ]]; then
            docker buildx imagetools create --tag ghcr.io/moepig/cheapskate-reconciler:latest "ghcr.io/moepig/cheapskate-reconciler:${RELEASE_TAG#v}"
            docker buildx imagetools create --tag ghcr.io/moepig/cheapskate-webconsole:latest "ghcr.io/moepig/cheapskate-webconsole:${RELEASE_TAG#v}"
          fi
      - name: Publish the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |-
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release edit "$RELEASE_TAG" --draft=false
