name: Distribute release
on:
  workflow_call:
    inputs:
      release-id:
        required: true
        type: string
      tag:
        required: true
        type: string
      sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      issues: read
      pull-requests: read
      actions: read
    steps:
      - uses: moepig/flexi/.github/actions/dependency-release@0de782a2a86360049265211687891636fb9c80a5
        with:
          token: ${{ github.token }}
          mode: verify
          release-id: ${{ inputs.release-id }}
          tag: ${{ inputs.tag }}
          sha: ${{ inputs.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: moepig/flexi/.github/actions/dependency-release@0de782a2a86360049265211687891636fb9c80a5
        with:
          token: ${{ github.token }}
          mode: verify
          release-id: ${{ inputs.release-id }}
          tag: ${{ inputs.tag }}
          sha: ${{ inputs.sha }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.2
          args: release --clean --skip=docker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
      - uses: moepig/flexi/.github/actions/dependency-release@0de782a2a86360049265211687891636fb9c80a5
        with:
          token: ${{ github.token }}
          mode: containers
          release-id: ${{ inputs.release-id }}
          tag: ${{ inputs.tag }}
          sha: ${{ inputs.sha }}
