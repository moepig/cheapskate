name: test

# The whole test suite, as one callable unit. Both the CI workflow and the release workflow call
# it, so a release runs exactly the checks a pull request runs — nothing releases untested.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # gofmt + go vet, including the `integration` and `image` build tags, which the default vet skips.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make lint

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make unit

  # Starts the AWS emulator (Floci) through testcontainers-go, which needs only the runner's
  # docker daemon; the emulator itself spawns RDS/ECS containers through the mounted socket.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make integration

  # Builds both images from the root Dockerfile and drives them through the Runtime Interface
  # Emulator. Slower than the rest (~90s of image build before the first assertion).
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make image-test

  # goreleaser only ever runs in Actions, so a broken .goreleaser.yaml would otherwise surface for
  # the first time on a tag, after the release is already unstoppable. `check` catches that here,
  # in seconds. It validates the config without building, so it cannot see a broken
  # build/Dockerfile.* — the release-snapshot job in ci.yml covers that, on the pull requests that
  # can actually break it.
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: check
