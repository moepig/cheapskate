version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      aws-sdk:
        patterns:
          - github.com/aws/*
        applies-to: version-updates
      minor-and-patch:
        update-types:
          - minor
          - patch
        applies-to: version-updates
    commit-message:
      prefix: fix
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
        applies-to: version-updates
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: docker
    directories:
      - /
      - /build
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      images:
        patterns:
          - "*"
        applies-to: version-updates
    commit-message:
      prefix: fix
      include: scope
